real_jackal_spubert_bridge:
  ros__parameters:
    model_repo_path: /root/moai_social_bert_refactored
    model_config_path: /root/moai_social_bert_refactored/configs/spubert/moai_social_nav_route_gp_continue_b21_col01_social005.yaml
    model_checkpoint_path: /root/moai_social_bert_refactored/output/spubert_route_gp_continue_b21_col01_social005/model_best.pth
    use_cuda: true
    runtime_seed: 21
    d_sample: 40
    tgp_top_k: 5

    odom_topic: /aft_mapped_to_init
    tracks_topic: /ped_tracking
    scan_topic: /scan
    goal_topic: /goal_pose
    path_topic: /spu_bert/predicted_path
    collision_marker_topic: /spu_bert/collision_markers
    final_goal_topic: /spu_bert/final_goal_odom
    global_path_topic: /spu_bert/global_path_odom
    compute_path_action: /compute_path_to_pose
    base_frame: base_link
    tracks_are_robot_relative: true
    require_global_path: true

    obs_len: 8
    pred_len: 12
    prediction_dt: 0.4
    replan_period: 0.8
    route_refresh_period_sec: 2.0
    guidance_radius: 8.0
    adaptive_guidance: true
    adaptive_guidance_min_distance: 2.0
    adaptive_guidance_probe_step: 0.5

    # If guidance/candidates stay rejected as blocked this long, sweep-scan
    # in place instead of holding forever (see real_jackal_spubert_bridge_node.py).
    stuck_hold_timeout_sec: 3.0
    recovery_sweep_angle_rad: 1.10
    recovery_sweep_period_sec: 2.5
    recovery_step_m: 1.00

    # Follow a safe prefix of the Nav2 path when every SPU-BERT candidate is rejected.
    global_path_fallback: true
    global_fallback_length_m: 1.5
    global_fallback_min_safe_length_m: 0.8
    global_fallback_max_sec: 60.0
    global_fallback_max_shift_m: 0.30
    global_fallback_shift_step_m: 0.03
    global_fallback_taper_m: 0.40
    arc_planner_fallback: true
    arc_max_curvature: 1.6
    arc_curvature_step: 0.1
    arc_target_distance_m: 2.0
    # Start-direction offsets below the tracker's 0.95 rad rotate-in-place angle: curve while driving.
    arc_heading_offsets_rad: [0.0, 0.4, -0.4, 0.8, -0.8]
    # Last keep-moving tier when nothing fits at robot_radius+margin (0.44 m).
    escape_footprint_radius_m: 0.36
    # escape radius adapts to the robot's current clearance, never below this floor (body diagonal radius).
    escape_floor_radius_m: 0.33

    robot_radius: 0.34
    # 0.16 -> 0.10 (09-30): with robot_radius 0.34 the 0.50m footprint left only
    # ~1.2m of free width in the ~2.1-2.4m corridors; this check runs on the
    # lidar rolling map in odom (not AMCL), so it needn't absorb localization error.
    static_safety_margin: 0.10
    minimum_human_center_distance: 1.20
    human_radius: 0.35
    human_safety_margin: 0.20
    maximum_model_speed: 1.50
    maximum_step_ratio: 1.50
    minimum_goal_progress: 0.10
    goal_tolerance: 0.50

    rolling_map_size_m: 24.0
    rolling_map_resolution: 0.10
    free_gap_fill_m: 0.20
    free_ray_limit_m: 11.5
    odom_timeout_sec: 0.60
    scan_timeout_sec: 0.60
    tracks_timeout_sec: 1.00
    minimum_track_score: 0.30
    diagnostics_path: /root/jackal_logs/spubert_real_jackal_diagnostics.jsonl

safe_path_tracker:
  ros__parameters:
    odom_topic: /aft_mapped_to_init
    path_topic: /spu_bert/predicted_path
    goal_topic: /spu_bert/final_goal_odom
    scan_topic: /scan
    tracks_topic: /ped_tracking
    cmd_vel_topic: /spu_bert/cmd_vel_dryrun
    base_frame: base_link
    emergency_stop_topic: /spu_bert/emergency_stop
    enable_service: /spu_bert/enable_motion
    diagnostics_topic: /spu_bert/tracker_diagnostics
    lookahead_marker_topic: /spu_bert/tracker_lookahead

    motion_enabled: false
    require_tracks_heartbeat: true
    control_rate_hz: 10.0
    lookahead_distance: 0.70
    goal_tolerance: 0.50
    maximum_linear_speed: 0.25
    maximum_angular_speed: 0.55
    maximum_linear_acceleration: 0.35
    maximum_angular_acceleration: 1.20
    path_timeout_sec: 1.20
    odom_timeout_sec: 0.50
    scan_timeout_sec: 0.50
    tracks_timeout_sec: 1.00
    # 09-30: the old rule (any point within 0.75 m in a +-40 deg sector => stop)
    # froze the robot beside a box in the ~2 m corridor although the planner had a
    # validated path. Now only obstacles in the straight-ahead body corridor stop
    # or slow it; anything inside 0.38 m in the sector is still an emergency stop.
    obstacle_stop_distance: 0.45
    obstacle_slow_distance: 1.00
    # corridor = body half width 0.215 + 0.125; hard stop sits inside the body's circumscribed
    # radius (0.33) but beyond the front face (0.25) so passing a box corner is not a stop.
    obstacle_corridor_half_width: 0.34
    obstacle_hard_stop_distance: 0.30
    forward_scan_half_angle: 0.70
    human_stop_distance: 0.90
    rotate_in_place_angle: 0.95
    angular_gain: 1.60
