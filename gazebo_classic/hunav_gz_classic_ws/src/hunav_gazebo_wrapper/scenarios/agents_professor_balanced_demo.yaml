hunav_loader:
  ros__parameters:
    yaml_base_name: agents_professor_balanced_demo
    simulator: Gazebo Classic
    map: training_route_choice
    publish_people: true

    # Four independent lanes create sequential interactions instead of one
    # congested knot. Long cyclic routes keep every pedestrian moving for the
    # complete robot episode.
    global_goals:
      1: {x: -3.200, y: 4.200}
      2: {x: -3.200, y: -7.000}
      3: {x: -8.800, y: -7.000}
      4: {x: -8.800, y: 4.200}

      5: {x: -1.300, y: 6.400}
      6: {x: -1.300, y: -6.800}
      7: {x: 5.400, y: -6.800}
      8: {x: 5.400, y: 4.800}

      9: {x: 9.200, y: -3.700}
      10: {x: -8.500, y: -3.700}
      11: {x: -8.500, y: -4.800}
      12: {x: 9.200, y: -4.800}

      13: {x: 5.500, y: 4.800}
      14: {x: 5.500, y: -6.800}
      15: {x: 9.200, y: -6.800}
      16: {x: 9.200, y: 4.800}

    agents:
      - agent1
      - agent2
      - agent3
      - agent4

    # Early crossing before the central obstacle.
    agent1:
      id: 1
      group_id: -1
      skin: 0
      max_vel: 0.70
      radius: 0.33
      goal_radius: 0.35
      cyclic_goals: true
      init_pose: {x: -3.200, y: 4.200, z: 1.250, h: -1.57080}
      behavior:
        type: Regular
        configuration: 1
        goal_force_factor: 2.0
        obstacle_force_factor: 5.0
        social_force_factor: 2.2
        other_force_factor: 6.0
      goals: [2, 3, 4, 1]

    # Crossing near the entrance of the lower bypass. The 4 m upper approach
    # delays the crossing without requiring an artificially slow pedestrian.
    # Its x offset preserves a close encounter while keeping an independently
    # moving pedestrian from walking through a yielding, stationary robot.
    agent2:
      id: 2
      group_id: -1
      skin: 1
      max_vel: 0.72
      radius: 0.33
      goal_radius: 0.35
      cyclic_goals: true
      init_pose: {x: -5.300, y: 6.400, z: 1.250, h: 0.00000}
      behavior:
        type: Regular
        configuration: 1
        goal_force_factor: 2.0
        obstacle_force_factor: 5.0
        social_force_factor: 2.2
        other_force_factor: 6.0
      goals: [5, 6, 7, 8]

    # Offset oncoming pedestrian beside the lower bypass. This remains a close
    # moving encounter without turning the narrow detour into a deadlock.
    agent3:
      id: 3
      group_id: -1
      skin: 4
      max_vel: 0.62
      radius: 0.33
      goal_radius: 0.35
      cyclic_goals: true
      init_pose: {x: 9.200, y: -3.700, z: 1.250, h: 3.14159}
      behavior:
        type: Regular
        configuration: 1
        goal_force_factor: 2.0
        obstacle_force_factor: 5.0
        social_force_factor: 2.2
        other_force_factor: 6.0
      goals: [10, 11, 12, 9]

    # Late crossing after the central obstacle.
    agent4:
      id: 4
      group_id: -1
      skin: 2
      max_vel: 0.58
      radius: 0.33
      goal_radius: 0.35
      cyclic_goals: true
      init_pose: {x: 5.500, y: 6.400, z: 1.250, h: -1.57080}
      behavior:
        type: Regular
        configuration: 1
        goal_force_factor: 2.0
        obstacle_force_factor: 5.0
        social_force_factor: 2.2
        other_force_factor: 6.0
      goals: [14, 15, 16, 13]
