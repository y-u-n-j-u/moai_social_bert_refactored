hunav_loader:
  ros__parameters:
    yaml_base_name: agents_training_slalom_high
    simulator: Gazebo Classic
    map: training_slalom
    publish_people: true
    global_goals:
      1:
        x: -8.200
        y: -6.500
      2:
        x: -8.200
        y: 6.500
      3:
        x: -2.500
        y: 6.500
