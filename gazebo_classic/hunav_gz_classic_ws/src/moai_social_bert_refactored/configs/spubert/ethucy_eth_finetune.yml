experiment:
  name: spubert_eth_finetune
  framework: spubert
  task: finetune
  seed: 1

data:
  dataset_name: ethucy_sbert
  dataset_path: ./data/processed
  dataset_split: eth
  obs_len: 8
  pred_len: 12
  num_nbr: 4
  view_range: 20.0
  view_angle: 1.0
  social_range: 2.0
  traj_scale: 2.0

scene:
  enabled: true
  env_range: 10.0
  env_resol: 0.1
  patch_size: 16

model:
  backbone:
    type: bert
    hidden_size: 256
    num_hidden_layers: 4
    num_attention_heads: 4
    dropout_prob: 0.1
  heads:
    spubert:
      goal_hidden: 64
      goal_latent: 64
      k_sample: 20
      d_sample: 400
      share_backbone: false
      normal: false

loss:
  traj_weight: 1.0
  goal_weight: 1.0
  kld_weight: 1.0
  kld_clamp: 2.0

train:
  train_mode: fs
  batch_size: 32
  test_batch_size: 32
  epoch: 100
  eval_interval: 10
  checkpoint_interval: 20
  lr_scheduler: step
  optimizer:
    lr: 1.0e-4
  scheduler:
    decay_step: 10
    decay_gamma: 0.5
  evaluate_on_test: false

runtime:
  cuda: true
  model_dir: ./output
