experiment:
  name: spubert_ethucy_univ_finetune_speed
  framework: spubert
  task: finetune
  seed: 20

data:
  dataset_name: ethucy_sbert_ext
  dataset_path: ./data/processed
  dataset_split: univ
  obs_len: 8
  pred_len: 12
  num_nbr: 4
  goal_extra_frames: 50    # 곡선/방향전환 경로도 커버 (직선 기준 extra=8이면 충분하나 여유 있게)
  goal_look_ahead: 20      # goal_dist = avg_speed * 20 → slow 4.9m / medium 10.3m / fast 13.4m

scene:
  enabled: true
  env_range: 10.0
  env_resol: 0.2
  patch_size: 16

model:
  backbone:
    type: bert
    hidden_size: 256
    num_hidden_layers: 4
    num_attention_heads: 4
    dropout_prob: 0.1
  heads:
    spubert:
      k_sample: 20
      d_sample: 400
      goal_hidden: 64
      goal_latent: 32

loss:
  col_weight: 1.0

train:
  train_mode: pt
  batch_size: 32
  test_batch_size: 32
  epoch: 200
  eval_interval: 10
  checkpoint_interval: 20
  optimizer:
    lr: 1.0e-4
  evaluate_on_test: false
  use_gt_goal: false
  use_gaussian_goal: true
  gaussian_goal_k: 10
  gaussian_goal_sigma: 1.0
  use_goal_sampling: true
  goal_k: 10
  goal_sigma: 1.0

runtime:
  cuda: true
  model_dir: ./output
  pretrain_checkpoint: ./output/spubert/ethucy_sbert/univ/pretrain_model_best.pth
