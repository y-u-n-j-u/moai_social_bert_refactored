experiment:
  name: sbert_jrdb_finetune
  framework: sbert
  task: finetune
  seed: 20

data:
  dataset_name: JRDB
  dataset_path: ./data/raw
  dataset_split: univ
  obs_len: 8
  pred_len: 12
  num_nbr: 4

model:
  backbone:
    type: bert
    hidden_size: 256
    num_hidden_layers: 4
    num_attention_heads: 4
    dropout_prob: 0.1

train:
  batch_size: 32
  test_batch_size: 32
  epoch: 200
  eval_interval: 10
  checkpoint_interval: 20
  optimizer:
    lr: 1.0e-4
  evaluate_on_test: false

runtime:
  cuda: false
  model_dir: ./output
